<section class="formulario">

    <h1>Reportar Mascota</h1>

    <p class="subtitulo">

        Completa el siguiente formulario para publicar una mascota perdida o encontrada.

    </p>

    <form id="formMascota">

        <label for="nombre">Nombre de la mascota</label>

        <input
            type="text"
            id="nombre"
            placeholder="Ejemplo: Max"
            required>

        <label for="estado">Estado</label>

        <select id="estado" required>

            <option value="">Seleccione</option>
            <option value="Perdido">Perdido</option>
            <option value="Encontrado">Encontrado</option>

        </select>

        <label for="especie">Especie</label>

        <select id="especie" required>

            <option value="">Seleccione</option>
            <option value="Perro">Perro</option>
            <option value="Gato">Gato</option>
            <option value="Otro">Otro</option>

        </select>

        <label for="raza">Raza</label>

        <input
            type="text"
            id="raza"
            placeholder="Ejemplo: Labrador">

        <label for="color">Color</label>

        <input
            type="text"
            id="color"
            placeholder="Ejemplo: Café con blanco">
                    <label for="ciudad">Ciudad</label>

        <input
            type="text"
            id="ciudad"
            placeholder="Ejemplo: Cartago"
            required>

        <label for="barrio">Barrio o Sector</label>

        <input
            type="text"
            id="barrio"
            placeholder="Ejemplo: Centro">

        <label for="fecha">Fecha en que se perdió o encontró</label>

        <input
            type="date"
            id="fecha"
            required>

        <label for="descripcion">Descripción</label>

        <textarea
            id="descripcion"
            rows="5"
            placeholder="Describe la mascota, accesorios, características, dónde fue vista por última vez..."
            required></textarea>

        <label for="telefono">Teléfono de contacto</label>

        <input
            type="tel"
            id="telefono"
            placeholder="Ejemplo: 3001234567"
            required>

        <label for="correo">Correo electrónico</label>

        <input
            type="email"
            id="correo"
            placeholder="correo@ejemplo.com"
            required>

        <label for="foto">Fotografía</label>

        <input
            type="file"
            id="foto"
            accept="image/*"
            required>

        <img
            id="preview"
            src=""
            alt="Vista previa"
            style="display:none; max-width:300px; margin-top:20px; border-radius:15px;">

        <button type="submit" class="btnPrincipal">

            Publicar Reporte

        </button>
            </form>

</section>
